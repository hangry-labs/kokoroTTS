version: '3'

vars:
  IMAGE: kokorotts:test
  TINY_IMAGE: kokorotts:tiny
  PORT: '7860'
  GPU_DEVICE: '0'
  APP_DEVICE: 'auto'
  HF_TOKEN: ''
  HF_CACHE_VOLUME: kokorotts_hf_cache
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'
  CONTAINER: kokorotts
  CONTAINER_LOCAL: kokorotts_local
  TEMP_WAV: '%TEMP%\\kokorotts_task.wav'
  TEMP_AUDIO: '%TEMP%\\kokorotts_task_audio'
  API_TEXT: 'Hello world. This is Kokoro TTS.'
  API_VOICE: 'af_heart'
  API_FORMAT: 'mp3'
  BENCHMARK_BASE_URL: 'http://127.0.0.1:7860'
  BENCHMARK_LIMIT: '0'
  BENCHMARK_REPETITIONS: '5'
  BENCHMARK_COMMENT: ''
  BENCHMARK_REQUEST_TIMEOUT: '240'
  VRAM_BENCHMARK_LIMIT: '0'
  VRAM_BENCHMARK_SAMPLE_INTERVAL: '0.05'
  VRAM_BENCHMARK_COMMENT: ''
  DRY_RUN: '0'
  NEXT_VERSION: ''
  SKIP_VALIDATION: '0'

tasks:
  gpuinfo:
    desc: Show host GPU indexes (use with GPU_DEVICE variable)
    cmds:
      - cmd /c nvidia-smi --query-gpu=index,name --format=csv,noheader

  image:
    desc: Build local baked KokoroTTS Docker image
    cmds:
      - cmd /c docker build --target baked -t {{.IMAGE}} .

  image-tiny:
    desc: Build local tiny KokoroTTS Docker image without baked model/voice cache
    cmds:
      - cmd /c docker build --target tiny -t {{.TINY_IMAGE}} .

  cache-init:
    desc: Seed the persistent Hugging Face cache volume from the baked image
    cmds:
      - cmd /c docker volume create {{.HF_CACHE_VOLUME}} >nul
      - cmd /c docker run --rm -v {{.HF_CACHE_VOLUME}}:/cache {{.IMAGE}} sh -c "mkdir -p /cache && cp -an /app/.cache/huggingface/. /cache/ || true"

  release:
    desc: Release current VERSION snapshot, tag it, and prepare next snapshot
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/release.ps1 -DryRun "{{.DRY_RUN}}" -NextVersion "{{.NEXT_VERSION}}" -SkipValidation "{{.SKIP_VALIDATION}}"

  deps:
    desc: Regenerate Linux/Python 3.13 pinned requirements.txt from requirements.in
    cmds:
      - uv pip compile requirements.in --python-version 3.13 --python-platform x86_64-manylinux_2_36 --index-strategy unsafe-best-match --upgrade --no-header --no-annotate --output-file requirements.txt

  imagerun:
    desc: Run baked image with UI and API on PORT (default GPU_DEVICE=0)
    cmds:
      - cmd /c docker rm -f {{.CONTAINER}} >nul 2>&1
      - cmd /c docker rm -f {{.CONTAINER_LOCAL}} >nul 2>&1
      - task: cache-init
      - cmd /c docker run -d --name {{.CONTAINER}} -p {{.PORT}}:7860 --gpus all -e CUDA_VISIBLE_DEVICES={{.GPU_DEVICE}} -e KOKOROTTS_DEVICE={{.APP_DEVICE}} -e PORT=7860 -e HF_TOKEN={{.HF_TOKEN}} -e HF_HUB_OFFLINE={{.HF_HUB_OFFLINE}} -e TRANSFORMERS_OFFLINE={{.TRANSFORMERS_OFFLINE}} -v {{.HF_CACHE_VOLUME}}:/app/.cache/huggingface {{.IMAGE}}
      - cmd /c docker ps --filter "name={{.CONTAINER}}"

  imagerun-tiny:
    desc: Run tiny image online on first use, using the persistent Hugging Face cache volume
    cmds:
      - cmd /c docker rm -f {{.CONTAINER}} >nul 2>&1
      - cmd /c docker rm -f {{.CONTAINER_LOCAL}} >nul 2>&1
      - cmd /c docker volume create {{.HF_CACHE_VOLUME}} >nul
      - cmd /c docker run -d --name {{.CONTAINER}} -p {{.PORT}}:7860 --gpus all -e CUDA_VISIBLE_DEVICES={{.GPU_DEVICE}} -e KOKOROTTS_DEVICE={{.APP_DEVICE}} -e PORT=7860 -e HF_TOKEN={{.HF_TOKEN}} -e HF_HUB_OFFLINE=0 -e TRANSFORMERS_OFFLINE=0 -v {{.HF_CACHE_VOLUME}}:/app/.cache/huggingface {{.TINY_IMAGE}}
      - cmd /c docker ps --filter "name={{.CONTAINER}}"

  localrun:
    desc: Run baked image with local kokorotts/ bind-mounted for hot-swapping
    cmds:
      - cmd /c docker rm -f {{.CONTAINER}} >nul 2>&1
      - cmd /c docker rm -f {{.CONTAINER_LOCAL}} >nul 2>&1
      - task: cache-init
      - cmd /c docker run -d --name {{.CONTAINER_LOCAL}} -p {{.PORT}}:7860 --gpus all -e CUDA_VISIBLE_DEVICES={{.GPU_DEVICE}} -e KOKOROTTS_DEVICE={{.APP_DEVICE}} -e KOKOROTTS_UI_DEV=1 -e PORT=7860 -e UVICORN_RELOAD=1 -e HF_TOKEN={{.HF_TOKEN}} -e HF_HUB_OFFLINE={{.HF_HUB_OFFLINE}} -e TRANSFORMERS_OFFLINE={{.TRANSFORMERS_OFFLINE}} -v {{.HF_CACHE_VOLUME}}:/app/.cache/huggingface -v "{{.TASKFILE_DIR}}\kokorotts:/app/kokorotts" -v "{{.TASKFILE_DIR}}\assets:/app/assets:ro" {{.IMAGE}}
      - cmd /c docker ps --filter "name={{.CONTAINER_LOCAL}}"

  localrun-tiny:
    desc: Run tiny image with local kokorotts/ bind-mounted, online on first use
    cmds:
      - cmd /c docker rm -f {{.CONTAINER}} >nul 2>&1
      - cmd /c docker rm -f {{.CONTAINER_LOCAL}} >nul 2>&1
      - cmd /c docker volume create {{.HF_CACHE_VOLUME}} >nul
      - cmd /c docker run -d --name {{.CONTAINER_LOCAL}} -p {{.PORT}}:7860 --gpus all -e CUDA_VISIBLE_DEVICES={{.GPU_DEVICE}} -e KOKOROTTS_DEVICE={{.APP_DEVICE}} -e KOKOROTTS_UI_DEV=1 -e PORT=7860 -e UVICORN_RELOAD=1 -e HF_TOKEN={{.HF_TOKEN}} -e HF_HUB_OFFLINE=0 -e TRANSFORMERS_OFFLINE=0 -v {{.HF_CACHE_VOLUME}}:/app/.cache/huggingface -v "{{.TASKFILE_DIR}}\kokorotts:/app/kokorotts" -v "{{.TASKFILE_DIR}}\assets:/app/assets:ro" {{.TINY_IMAGE}}
      - cmd /c docker ps --filter "name={{.CONTAINER_LOCAL}}"

  imageweb:
    desc: Open default browser to local KokoroTTS UI
    cmds:
      - cmd /c start "" "http://localhost:{{.PORT}}"

  imageapi:
    desc: Call API, play generated temp audio, then remove it
    cmds:
      - 'cmd /c curl.exe -sS --retry 30 --retry-delay 2 --retry-all-errors http://localhost:{{.PORT}}/tts/ping >nul'
      - 'cmd /c curl.exe -sS -X POST http://localhost:{{.PORT}}/tts/generate -H "Content-Type: application/json" -d "{\"text\":\"{{.API_TEXT}}\",\"speed\":1.0,\"voice\":\"{{.API_VOICE}}\",\"device\":\"{{.APP_DEVICE}}\",\"output_format\":\"{{.API_FORMAT}}\"}" --output {{.TEMP_AUDIO}}.{{.API_FORMAT}}'
      - 'cmd /c if not exist {{.TEMP_AUDIO}}.{{.API_FORMAT}} exit /b 1'
      - 'cmd /c python -c "from pathlib import Path; p=Path(r''{{.TEMP_AUDIO}}.{{.API_FORMAT}}''); assert p.exists() and p.stat().st_size > 0, p"'
      - 'powershell -NoProfile -ExecutionPolicy Bypass -File scripts/play-audio.ps1 -Path "{{.TEMP_AUDIO}}.{{.API_FORMAT}}"'
      - 'cmd /c del /f /q {{.TEMP_AUDIO}}.{{.API_FORMAT}}'

  imageapi-voice:
    desc: Call API for API_VOICE/API_TEXT, play generated temp WAV, then remove it
    cmds:
      - 'cmd /c curl.exe -sS --retry 30 --retry-delay 2 --retry-all-errors http://localhost:{{.PORT}}/tts/ping >nul'
      - 'cmd /c curl.exe -sS -X POST http://localhost:{{.PORT}}/tts/generate -H "Content-Type: application/json" -d "{\"text\":\"{{.API_TEXT}}\",\"speed\":1.0,\"voice\":\"{{.API_VOICE}}\",\"device\":\"{{.APP_DEVICE}}\"}" --output {{.TEMP_WAV}}'
      - 'cmd /c if not exist {{.TEMP_WAV}} exit /b 1'
      - 'cmd /c python -c "import winsound; winsound.PlaySound(r''{{.TEMP_WAV}}'', winsound.SND_FILENAME)"'
      - 'cmd /c del /f /q {{.TEMP_WAV}}'

  german-test:
    desc: Generate and play one German sample with Martin and Victoria
    cmds:
      - task: imageapi-voice
        vars:
          API_VOICE: dm_martin
          API_TEXT: 'Guten Tag. Das ist Martin von Kokoro TTS. Diese Stimme verwendet ein eigenes deutsches Modell.'
      - task: imageapi-voice
        vars:
          API_VOICE: df_victoria
          API_TEXT: 'Guten Tag. Das ist Victoria von Kokoro TTS. Diese Stimme verwendet ein eigenes deutsches Modell.'

  imageapi-format:
    desc: Call API for API_FORMAT and verify the output file is non-empty
    cmds:
      - 'cmd /c curl.exe -sS --retry 30 --retry-delay 2 --retry-all-errors http://localhost:{{.PORT}}/tts/ping >nul'
      - 'cmd /c curl.exe -sS -X POST http://localhost:{{.PORT}}/tts/generate -H "Content-Type: application/json" -d "{\"text\":\"{{.API_TEXT}}\",\"speed\":1.0,\"voice\":\"{{.API_VOICE}}\",\"device\":\"{{.APP_DEVICE}}\",\"output_format\":\"{{.API_FORMAT}}\"}" --output {{.TEMP_AUDIO}}.{{.API_FORMAT}}'
      - 'cmd /c if not exist {{.TEMP_AUDIO}}.{{.API_FORMAT}} exit /b 1'
      - 'cmd /c python -c "from pathlib import Path; p=Path(r''{{.TEMP_AUDIO}}.{{.API_FORMAT}}''); assert p.exists() and p.stat().st_size > 0, p"'
      - 'cmd /c del /f /q {{.TEMP_AUDIO}}.{{.API_FORMAT}}'

  client-test:
    desc: Run server-backed KokoroTTS Python client API tests
    cmds:
      - 'cmd /c curl.exe -sS --retry 30 --retry-delay 2 --retry-all-errors http://localhost:{{.PORT}}/tts/ping >nul'
      - 'cmd /c "set KOKOROTTS_TEST_BASE_URL=http://localhost:{{.PORT}}&& python tests/run_client_tests.py"'

  benchmark-smoke:
    desc: Run two voice-generation performance cases without updating benchmark history
    cmds:
      - 'cmd /c curl.exe -sS --retry 30 --retry-delay 2 --retry-all-errors {{.BENCHMARK_BASE_URL}}/tts/ping >nul'
      - 'cmd /c python "benchmarks\tts\run_benchmark.py" --base-url {{.BENCHMARK_BASE_URL}} --device {{.APP_DEVICE}} --limit 2 --repetitions 1 --request-timeout {{.BENCHMARK_REQUEST_TIMEOUT}} --gpu-index {{.GPU_DEVICE}} --output "%TEMP%\kokorotts_benchmark_smoke.json" --no-append'

  benchmark-tts:
    desc: Run the repeatable multilingual TTS benchmark and append its result
    cmds:
      - 'cmd /c curl.exe -sS --retry 30 --retry-delay 2 --retry-all-errors {{.BENCHMARK_BASE_URL}}/tts/ping >nul'
      - 'cmd /c python "benchmarks\tts\run_benchmark.py" --base-url {{.BENCHMARK_BASE_URL}} --device {{.APP_DEVICE}} --limit {{.BENCHMARK_LIMIT}} --repetitions {{.BENCHMARK_REPETITIONS}} --request-timeout {{.BENCHMARK_REQUEST_TIMEOUT}} --gpu-index {{.GPU_DEVICE}} --comment "{{.BENCHMARK_COMMENT}}"'

  benchmark-test:
    desc: Run benchmark runner unit tests in the local image without starting inference
    cmds:
      - 'cmd /c docker run --rm --entrypoint python -v "{{.TASKFILE_DIR}}\kokorotts:/app/kokorotts:ro" -v "{{.TASKFILE_DIR}}\benchmarks:/app/benchmarks:ro" -v "{{.TASKFILE_DIR}}\examples:/app/examples:ro" -v "{{.TASKFILE_DIR}}\tests:/app/tests:ro" {{.IMAGE}} -m unittest tests.test_benchmark tests.test_vram_benchmark -v'

  benchmark-vram-smoke:
    desc: Check the isolated VRAM benchmark with one voice without recording history
    cmds:
      - 'cmd /c docker run --rm --gpus all -e CUDA_VISIBLE_DEVICES={{.GPU_DEVICE}} -e HF_HUB_OFFLINE=1 -e TRANSFORMERS_OFFLINE=1 -e LOGURU_LEVEL=INFO --entrypoint python -v "{{.TASKFILE_DIR}}\benchmarks:/app/benchmarks" -v "{{.TASKFILE_DIR}}\examples:/app/examples:ro" {{.IMAGE}} -m benchmarks.vram.run_benchmark --device cuda:0 --gpu-index {{.GPU_DEVICE}} --limit 1 --sample-interval {{.VRAM_BENCHMARK_SAMPLE_INTERVAL}} --output /tmp/kokorotts_vram_smoke.json --no-append'

  benchmark-vram:
    desc: Measure isolated process and whole-device VRAM for every example voice
    cmds:
      - 'cmd /c docker run --rm --gpus all -e CUDA_VISIBLE_DEVICES={{.GPU_DEVICE}} -e HF_HUB_OFFLINE=1 -e TRANSFORMERS_OFFLINE=1 -e LOGURU_LEVEL=INFO --entrypoint python -v "{{.TASKFILE_DIR}}\benchmarks:/app/benchmarks" -v "{{.TASKFILE_DIR}}\examples:/app/examples:ro" {{.IMAGE}} -m benchmarks.vram.run_benchmark --device cuda:0 --gpu-index {{.GPU_DEVICE}} --limit {{.VRAM_BENCHMARK_LIMIT}} --sample-interval {{.VRAM_BENCHMARK_SAMPLE_INTERVAL}} --comment "{{.VRAM_BENCHMARK_COMMENT}}"'

  ui-test:
    desc: Run standalone UI route and cache-policy tests inside the local image
    cmds:
      - 'cmd /c docker run --rm --entrypoint python -v "{{.TASKFILE_DIR}}\kokorotts:/app/kokorotts:ro" -v "{{.TASKFILE_DIR}}\assets:/app/assets:ro" -v "{{.TASKFILE_DIR}}\tests:/app/tests:ro" {{.IMAGE}} -m unittest tests.test_standalone_ui -v'

  unit-test:
    desc: Run focused runtime, chunking, audio, benchmark, and standalone UI tests in Docker
    cmds:
      - 'cmd /c docker run --rm --entrypoint python -v "{{.TASKFILE_DIR}}\kokorotts:/app/kokorotts:ro" -v "{{.TASKFILE_DIR}}\assets:/app/assets:ro" -v "{{.TASKFILE_DIR}}\benchmarks:/app/benchmarks:ro" -v "{{.TASKFILE_DIR}}\examples:/app/examples:ro" -v "{{.TASKFILE_DIR}}\tests:/app/tests:ro" {{.IMAGE}} -m unittest tests.test_audio tests.test_benchmark tests.test_vram_benchmark tests.test_german_support tests.test_pipeline_chunking tests.test_runtime tests.test_settings tests.test_standalone_ui -v'

  imagestop:
    desc: Stop running KokoroTTS containers
    cmds:
      - cmd: cmd /c docker stop {{.CONTAINER}} >nul 2>&1
        ignore_error: true
      - cmd: cmd /c docker stop {{.CONTAINER_LOCAL}} >nul 2>&1
        ignore_error: true

  logs:
    desc: Show logs from active KokoroTTS container
    cmds:
      - cmd /c docker logs --tail 200 {{.CONTAINER_LOCAL}} 2>nul || docker logs --tail 200 {{.CONTAINER}}

  nuke:
    desc: Remove KokoroTTS local containers, image, and Hugging Face cache volume
    cmds:
      - cmd /c docker rm -f {{.CONTAINER}} >nul 2>&1
      - cmd /c docker rm -f {{.CONTAINER_LOCAL}} >nul 2>&1
      - cmd /c docker rmi -f {{.IMAGE}} >nul 2>&1
      - cmd /c docker rmi -f {{.TINY_IMAGE}} >nul 2>&1
      - cmd /c docker volume rm -f {{.HF_CACHE_VOLUME}} >nul 2>&1

