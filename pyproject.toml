[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kokorotts"
# PEP 440 package metadata version. Runtime/release display version lives in VERSION.
version = "1.0.0.dev0"
description = "KokoroTTS standalone browser UI + API"
readme = "README.md"
authors = [
    { name="Hangry Labs" }
]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent"
]
requires-python = ">=3.13, <3.14"
dependencies = []

[project.optional-dependencies]
server = [
    "fastapi==0.136.3",
    "huggingface-hub==0.36.2",
    "loguru==0.7.3",
    "misaki[de,en,zh] @ https://github.com/hexgrad/misaki/archive/bbaf917e7bf7fbbe830f74f4acda6583ce1c0caf.tar.gz",
    "numpy==2.2.6",
    "pyopenjtalk==0.4.1",
    "sea-g2p==0.10.0",
    "setuptools==79.0.1",
    "torch==2.11.0",
    "transformers==4.57.6",
    "uvicorn[standard]==0.51.0",
    "vig2p==0.1.2"
]

[project.scripts]
kokorotts = "kokorotts.__main__:main"
kokoro = "kokorotts.__main__:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
only-include = ["kokorotts"]
only-packages = true
artifacts = [
    "kokorotts/standalone_ui/static/**",
]

[tool.hatch.build.targets.wheel.force-include]
"assets/kokoro_favicon.webp" = "assets/kokoro_favicon.webp"
"assets/kokoro_logo_horizontal.webp" = "assets/kokoro_logo_horizontal.webp"
"assets/hangrylabs_logo_horizontal.webp" = "assets/hangrylabs_logo_horizontal.webp"

[project.urls]
Homepage = "https://github.com/Hangry-Labs/kokoroTTS"
Repository = "https://github.com/Hangry-Labs/kokoroTTS"
