name: Build and Push Container Images

on:
  push:
    branches:
      - main
    tags:
      - "v*.*"
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional Docker tag to publish, for example v0.2"
        required: false
        type: string
      checkout_ref:
        description: "Optional git ref to build. Defaults to image_tag when image_tag is set."
        required: false
        type: string
      push_latest:
        description: "Also publish latest and latest_tiny"
        required: false
        default: true
        type: boolean

env:
  DOCKER_IMAGE_NAME: hangrylabs/kokorotts
  GHCR_IMAGE_NAME: ghcr.io/hangry-labs/kokorotts
  PYOPENJTALK_VERSION: 0.4.1
  PYOPENJTALK_WHEEL_CACHE: .build-cache/wheels

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || inputs.image_tag || github.ref }}

      - name: Free up disk space
        run: |
          echo "Initial disk usage:"
          df -h

          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/hostedtoolcache || true
          docker system prune -af || true

          echo "Disk usage after cleanup:"
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Restore pyopenjtalk wheel
        id: pyopenjtalk-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PYOPENJTALK_WHEEL_CACHE }}
          key: pyopenjtalk-wheel-${{ runner.os }}-${{ runner.arch }}-cp313-${{ env.PYOPENJTALK_VERSION }}-${{ hashFiles('Dockerfile') }}

      - name: Build pyopenjtalk wheel on cache miss
        if: steps.pyopenjtalk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PYOPENJTALK_WHEEL_CACHE"
          docker buildx build \
            --target pyopenjtalk-wheel \
            --build-arg "PYOPENJTALK_VERSION=$PYOPENJTALK_VERSION" \
            --output "type=local,dest=$PYOPENJTALK_WHEEL_CACHE" \
            .
          docker buildx prune --all --force

      - name: Verify pyopenjtalk wheel
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=("$PYOPENJTALK_WHEEL_CACHE"/pyopenjtalk-*.whl)
          if (( ${#wheels[@]} != 1 )); then
            echo "Expected exactly one cached pyopenjtalk wheel, found ${#wheels[@]}." >&2
            exit 1
          fi
          python -m zipfile -t "${wheels[0]}"
          ls -lh "${wheels[0]}"

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version if tag
        id: get_version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF##refs/tags/}" >> $GITHUB_ENV
          elif [[ -n "${{ inputs.image_tag }}" ]]; then
            echo "VERSION=${{ inputs.image_tag }}" >> $GITHUB_ENV
          fi

      - name: Prepare image tags
        id: image_tags
        run: |
          baked_tags=()
          tiny_tags=()
          if [[ "${{ github.event_name }}" == "push" && "$GITHUB_REF" == "refs/heads/main" ]] || \
             [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.push_latest }}" == "true" ]]; then
            baked_tags+=("$DOCKER_IMAGE_NAME:latest" "$GHCR_IMAGE_NAME:latest")
            tiny_tags+=("$DOCKER_IMAGE_NAME:latest_tiny" "$GHCR_IMAGE_NAME:latest_tiny")
          fi
          if [[ -n "$VERSION" ]]; then
            baked_tags+=("$DOCKER_IMAGE_NAME:$VERSION" "$GHCR_IMAGE_NAME:$VERSION")
            tiny_tags+=("$DOCKER_IMAGE_NAME:${VERSION}_tiny" "$GHCR_IMAGE_NAME:${VERSION}_tiny")
          fi
          if (( ${#baked_tags[@]} == 0 || ${#tiny_tags[@]} == 0 )); then
            echo "No Docker tags selected for publishing." >&2
            exit 1
          fi
          {
            echo "baked_tags<<EOF"
            printf '%s\n' "${baked_tags[@]}"
            echo "EOF"
            echo "tiny_tags<<EOF"
            printf '%s\n' "${tiny_tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push baked Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: baked
          push: true
          tags: ${{ steps.image_tags.outputs.baked_tags }}
          build-args: |
            PYOPENJTALK_VERSION=${{ env.PYOPENJTALK_VERSION }}

      - name: Report disk usage after baked image
        shell: bash
        run: |
          df -h
          docker buildx du || true

      - name: Build and push tiny Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: tiny
          push: true
          tags: ${{ steps.image_tags.outputs.tiny_tags }}
          build-args: |
            PYOPENJTALK_VERSION=${{ env.PYOPENJTALK_VERSION }}

      - name: Report final disk usage
        if: always()
        shell: bash
        run: |
          df -h
          docker buildx du || true

