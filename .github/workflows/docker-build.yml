name: Build and Push Docker Image (FULL)

on:
  push:
    branches:
      - main
    tags:
      - "v*.*"
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional Docker tag to publish, for example v0.2"
        required: false
        type: string
      checkout_ref:
        description: "Optional git ref to build. Defaults to image_tag when image_tag is set."
        required: false
        type: string
      push_latest:
        description: "Also publish latest"
        required: false
        default: true
        type: boolean

env:
  IMAGE_NAME: hangrylabs/kokorotts
  UNIDIC_CACHE_PATH: .build-cache/unidic/unidic-3.1.0.zip
  UNIDIC_SOURCE_URL: https://cotonoha-dic.s3-ap-northeast-1.amazonaws.com/unidic-3.1.0.zip
  UNIDIC_SHA256: 638718c4c63625ab300de4c92c67925d54c0e9e3830009eaa992f29819d59c43

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || inputs.image_tag || github.ref }}

      - name: Free up disk space
        run: |
          echo "Initial disk usage:"
          df -h

          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/hostedtoolcache || true
          docker system prune -af || true

          echo "Disk usage after cleanup:"
          df -h

      - name: Restore UniDic archive
        id: unidic-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.UNIDIC_CACHE_PATH }}
          key: unidic-${{ runner.os }}-${{ env.UNIDIC_SHA256 }}

      - name: Download UniDic archive on cache miss
        if: steps.unidic-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$UNIDIC_CACHE_PATH")"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$UNIDIC_CACHE_PATH" "$UNIDIC_SOURCE_URL"
          echo "$UNIDIC_SHA256  $UNIDIC_CACHE_PATH" | sha256sum --check --strict

      - name: Verify cached UniDic archive
        if: steps.unidic-cache.outputs.cache-hit == 'true'
        shell: bash
        run: echo "$UNIDIC_SHA256  $UNIDIC_CACHE_PATH" | sha256sum --check --strict

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Extract version if tag
        id: get_version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF##refs/tags/}" >> $GITHUB_ENV
          elif [[ -n "${{ inputs.image_tag }}" ]]; then
            echo "VERSION=${{ inputs.image_tag }}" >> $GITHUB_ENV
          fi

      - name: Prepare baked image tags
        id: image_tags
        run: |
          tags=()
          if [[ "${{ github.event_name }}" != "workflow_dispatch" || "${{ inputs.push_latest }}" == "true" ]]; then
            tags+=("$IMAGE_NAME:latest")
          fi
          if [[ -n "$VERSION" ]]; then
            tags+=("$IMAGE_NAME:$VERSION")
          fi
          if (( ${#tags[@]} == 0 )); then
            echo "No Docker tags selected for publishing." >&2
            exit 1
          fi
          {
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push baked Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: baked
          push: true
          tags: ${{ steps.image_tags.outputs.tags }}

